<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" role="img" aria-label="Kashif Rehman - Full Stack Developer - Eldian Core">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00D4FF"/>
      <stop offset="1" stop-color="#2F7BFF"/>
    </linearGradient>
    <radialGradient id="glowA"><stop offset="0" stop-color="#00D4FF" stop-opacity=".34"/><stop offset="1" stop-color="#00D4FF" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowB"><stop offset="0" stop-color="#0F6CBD" stop-opacity=".38"/><stop offset="1" stop-color="#0F6CBD" stop-opacity="0"/></radialGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00D4FF" stop-opacity="0"/>
      <stop offset=".5" stop-color="#00D4FF" stop-opacity=".12"/>
      <stop offset="1" stop-color="#00D4FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00D4FF" stop-opacity="0"/>
      <stop offset=".5" stop-color="#00D4FF" stop-opacity=".9"/>
      <stop offset="1" stop-color="#00D4FF" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#00D4FF" stroke-opacity=".07" stroke-width="1"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="280" rx="14"/></clipPath>
  </defs>

  <style>
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
    .sans{font-family:'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif}
    .in{opacity:0;animation:rise .9s cubic-bezier(.2,.7,.2,1) forwards}
    .d1{animation-delay:.1s}.d2{animation-delay:.3s}.d3{animation-delay:.5s}.d4{animation-delay:.7s}.d5{animation-delay:.9s}
    @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
    .drift1{animation:d1 14s ease-in-out infinite alternate}
    .drift2{animation:d2 18s ease-in-out infinite alternate}
    @keyframes d1{from{transform:translate(0,0)}to{transform:translate(-90px,40px)}}
    @keyframes d2{from{transform:translate(0,0)}to{transform:translate(110px,-30px)}}
    .scan{animation:scan 6s linear infinite}
    @keyframes scan{from{transform:translateY(-80px)}to{transform:translateY(300px)}}
    .float{animation:float 9s ease-in-out infinite alternate}
    @keyframes float{from{transform:translateY(0)}to{transform:translateY(-16px)}}
    .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2s ease-out infinite}
    @keyframes pulse{0%{transform:scale(1);opacity:.7}100%{transform:scale(3.2);opacity:0}}
    .slide{animation:slide 5s ease-in-out infinite}
    @keyframes slide{from{transform:translateX(-300px)}to{transform:translateX(1200px)}}
    .blink{animation:blink 1.1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="280" fill="#060708"/>
    <rect width="1200" height="280" fill="url(#grid)"/>

    <g class="drift1"><ellipse cx="1000" cy="40" rx="400" ry="220" fill="url(#glowA)"/></g>
    <g class="drift2"><ellipse cx="160" cy="290" rx="380" ry="200" fill="url(#glowB)"/></g>

    <g class="float mono" fill="#00D4FF" fill-opacity=".10" font-size="130" font-weight="700">
      <text x="905" y="190">&lt;/&gt;</text>
    </g>

    <rect class="scan" x="0" y="0" width="1200" height="80" fill="url(#scan)"/>

    <!-- label -->
    <g class="in d1">
      <rect x="60" y="56" width="8" height="8" fill="#00D4FF"/>
      <text class="mono" x="80" y="65" font-size="13" letter-spacing="3" fill="#00D4FF">SOFTWARE &amp; IT SERVICES  ·  HARIPUR, PAKISTAN</text>
    </g>

    <!-- name -->
    <text class="sans in d2" x="58" y="148" font-size="68" font-weight="800" fill="#FFFFFF" letter-spacing="-1.5">Kashif Rehman</text>

    <!-- role -->
    <text class="sans in d3" x="60" y="197" font-size="34" font-weight="600" fill="url(#accent)">Full Stack Developer</text>

    <!-- tagline -->
    <g class="in d4">
      <text class="mono" x="60" y="238" font-size="15" fill="#8B98A5">Laravel · React · Next.js · Node.js — software that businesses keep using.</text>
      <rect class="blink" x="62" y="246" width="9" height="2" fill="#00D4FF" opacity="0"/>
    </g>

    <!-- status chip -->
    <g class="in d5">
      <rect x="880" y="222" width="262" height="36" rx="18" fill="#0A1218" stroke="#00D4FF" stroke-opacity=".35"/>
      <circle class="pulse" cx="906" cy="240" r="4" fill="#00D4FF"/>
      <circle cx="906" cy="240" r="4" fill="#00D4FF"/>
      <text class="mono" x="922" y="245" font-size="12" letter-spacing="2" fill="#C9D1D9">OPEN TO OPPORTUNITIES</text>
    </g>

    <!-- bottom edge -->
    <rect x="0" y="277" width="1200" height="3" fill="#00D4FF" fill-opacity=".12"/>
    <rect class="slide" x="0" y="277" width="300" height="3" fill="url(#edge)"/>
  </g>
  <rect x=".5" y=".5" width="1199" height="279" rx="14" fill="none" stroke="#00D4FF" stroke-opacity=".18"/>
</svg>
